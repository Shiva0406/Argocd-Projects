
apiVersion: apps/v1
kind: Deployment

metadata:
  name: apache
  namespace: default
  labels:
    app: apache

spec:
  replicas: 2  # Create 2 Apache pods

  selector:
    matchLabels:
      app: apache

  template:
    metadata:
      labels:
        app: apache

    spec:
      containers:
        - name: apache
          image: httpd:2.4  # Official Apache image

          ports:
            - containerPort: 80
              name: http
