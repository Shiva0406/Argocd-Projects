
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: coffee-shop
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Shiva0406/Argocd-Projects.git
    targetRevision: main
    path: coffee-shop-fullstack/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: coffee-shop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
